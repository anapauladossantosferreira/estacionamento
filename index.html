<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Estacionamento Professional</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    header {
      background-color: #1e293b;
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 12px;
      flex: 1;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 5px;
      color: #475569;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      outline: none;
      font-size: 0.9rem;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #2563eb;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .grid-vagas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
    }

    .vaga {
      padding: 12px 5px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 75px;
    }

    .vaga span {
      font-size: 0.75rem;
      font-weight: normal;
      margin-top: 4px;
      word-break: break-all;
    }

    .livre { background-color: #10b981; }
    .ocupada { background-color: #ef4444; }
    .preferencial { border: 3px solid #f59e0b; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.85rem;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: white;
    }

    .badge-pago { background-color: #10b981; }
    .badge-pendente { background-color: #f59e0b; }

    .msg-erro {
      color: #ef4444;
      font-size: 0.75rem;
      margin-top: 3px;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Estacionamento ParkSys</h1>
    <div>Status: <strong>Operacional</strong></div>
  </header>

  <div class="dashboard">
    <aside>
      <div class="card">
        <h2>Entrada de Veículo</h2>
        
        <div class="form-group">
          <label>Placa do Veículo *</label>
          <input type="text" id="campo-placa" placeholder="EX: ABC1D23 ou ABC-1234" maxlength="8" style="text-transform: uppercase;">
          <span class="msg-erro" id="erro-placa">Placa inválida! Use o formato ABC1D23 ou ABC-1234.</span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Marca / Modelo *</label>
            <input type="text" id="campo-modelo" placeholder="Ex: VW Gol">
          </div>
          <div class="form-group">
            <label>Cor *</label>
            <input type="text" id="campo-cor" placeholder="Ex: Preto">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Nome do Condutor</label>
            <input type="text" id="campo-nome" placeholder="Nome completo">
          </div>
          <div class="form-group">
            <label>Data de Nasc.</label>
            <input type="date" id="campo-nascimento">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Tipo de Veículo</label>
            <select id="select-tipo">
              <option value="Carro">Carro (R$ 10/h)</option>
              <option value="Moto">Moto (R$ 5/h)</option>
              <option value="Utilitario">Utilitário (R$ 15/h)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Vaga Selecionada</label>
            <select id="select-vaga">
              <!-- Vagas inseridas via JS -->
            </select>
          </div>
        </div>

        <button type="button" id="btn-registrar" class="btn">Registrar Entrada</button>
      </div>

      <div class="card">
        <h2>Resumo do Dia</h2>
        <table>
          <tr>
            <td>Veículos Ativos:</td>
            <td><strong id="total-ativos">0</strong></td>
          </tr>
          <tr>
            <td>Faturamento Total:</td>
            <td><strong id="total-faturamento">R$ 0,00</strong></td>
          </tr>
        </table>
      </div>
    </aside>

    <main>
      <div class="card">
        <h2>Status das Vagas</h2>
        <div class="grid-vagas" id="container-vagas">
          <!-- Vagas criadas via JS -->
        </div>
      </div>

      <div class="card">
        <h2>Movimentações Recentes</h2>
        <table id="tabela-movimentos">
          <thead>
            <tr>
              <th>Placa</th>
              <th>Veículo</th>
              <th>Condutor</th>
              <th>Entrada</th>
              <th>Vaga</th>
              <th>Status</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody>
            <!-- Registros criados via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    // Configuração de Vagas
    const listaVagas = [
      { codigo: 'A1', tipo: 'Normal' },
      { codigo: 'A2', tipo: 'Normal' },
      { codigo: 'A3', tipo: 'PCD' },
      { codigo: 'A4', tipo: 'Idoso' },
      { codigo: 'A5', tipo: 'Normal' },
      { codigo: 'B1', tipo: 'Normal' },
      { codigo: 'B2', tipo: 'Normal' },
      { codigo: 'B3', tipo: 'Normal' },
      { codigo: 'B4', tipo: 'Idoso' },
      { codigo: 'B5', tipo: 'Normal' }
    ];

    const containerVagas = document.getElementById('container-vagas');
    const selectVaga = document.getElementById('select-vaga');
    const btnRegistrar = document.getElementById('btn-registrar');
    const inputPlaca = document.getElementById('campo-placa');
    const inputModelo = document.getElementById('campo-modelo');
    const inputCor = document.getElementById('campo-cor');
    const inputNome = document.getElementById('campo-nome');
    const inputNascimento = document.getElementById('campo-nascimento');
    const selectTipo = document.getElementById('select-tipo');
    const tabelaCorpo = document.querySelector('#tabela-movimentos tbody');
    const totalAtivos = document.getElementById('total-ativos');
    const totalFaturamento = document.getElementById('total-faturamento');
    const erroPlaca = document.getElementById('erro-placa');

    let ativosCount = 0;
    let faturamentoAcumulado = 0;

    // Função para validar formato de placa real (Brasil tradicional AAA-1234 ou Mercosul AAA1A23)
    function validarPlacaReal(placa) {
      const padraoTradicional = /^[A-Z]{3}-?[0-9]{4}$/;
      const padraoMercosul = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/;
      return padraoTradicional.test(placa) || padraoMercosul.test(placa);
    }

    // Formata automaticamente adicionando hífen se for placa antiga
    inputPlaca.addEventListener('input', function() {
      let v = this.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
      this.value = v;
      erroPlaca.style.display = 'none';
    });

    // Inicializa o mapa de vagas e as opções no select
    function carregarVagas() {
      containerVagas.innerHTML = '';
      selectVaga.innerHTML = '';

      listaVagas.forEach(vaga => {
        const opcao = document.createElement('option');
        opcao.value = vaga.codigo;
        opcao.textContent = `${vaga.codigo} (${vaga.tipo})`;
        selectVaga.appendChild(opcao);

        const divVaga = document.createElement('div');
        divVaga.className = `vaga livre ${vaga.tipo !== 'Normal' ? 'preferencial' : ''}`;
        divVaga.setAttribute('data-codigo', vaga.codigo);
        divVaga.innerHTML = `${vaga.codigo} <span>${vaga.tipo !== 'Normal' ? vaga.tipo : 'Livre'}</span>`;
        containerVagas.appendChild(divVaga);
      });
    }

    // Registrar Entrada do Veículo
    btnRegistrar.addEventListener('click', function() {
      const placa = inputPlaca.value.trim().toUpperCase();
      const modelo = inputModelo.value.trim();
      const cor = inputCor.value.trim();
      const nome = inputNome.value.trim() || 'Não informado';
      const codigoVaga = selectVaga.value;
      const tipoVeiculo = selectTipo.value;

      // Validação da Placa Real
      if (!validarPlacaReal(placa)) {
        erroPlaca.style.display = 'block';
        alert('Placa inválida! Informe uma placa válida no formato padrão ou Mercosul.');
        return;
      }

      if (!modelo || !cor) {
        alert('Por favor, informe a Marca/Modelo e a Cor do veículo.');
        return;
      }

      const elementoVaga = document.querySelector(`.vaga[data-codigo="${codigoVaga}"]`);

      if (elementoVaga && elementoVaga.classList.contains('ocupada')) {
        alert(`A vaga ${codigoVaga} já está ocupada! Escolha outra.`);
        return;
      }

      // 1. Atualizar o Mapa Visual
      if (elementoVaga) {
        elementoVaga.classList.remove('livre');
        elementoVaga.classList.add('ocupada');
        elementoVaga.querySelector('span').textContent = placa;
      }

      // 2. Registrar na Tabela
      const horaAtual = new Date();
      const horaEntradaTexto = horaAtual.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const novaLinha = document.createElement('tr');
      novaLinha.setAttribute('data-hora-entrada', horaAtual.getTime());
      novaLinha.setAttribute('data-tipo', tipoVeiculo);

      novaLinha.innerHTML = `
        <td><strong>${placa}</strong></td>
        <td>${modelo} (${cor})</td>
        <td>${nome}</td>
        <td>${horaEntradaTexto}</td>
        <td>${codigoVaga}</td>
        <td><span class="badge badge-pendente">Em Aberto</span></td>
        <td><button style="padding: 3px 8px; cursor:pointer;" onclick="registrarSaida(this, '${codigoVaga}')">Saída</button></td>
      `;

      tabelaCorpo.prepend(novaLinha);

      // 3. Limpar Formulário
      ativosCount++;
      totalAtivos.textContent = ativosCount;
      inputPlaca.value = '';
      inputModelo.value = '';
      inputCor.value = '';
      inputNome.value = '';
      inputNascimento.value = '';
    });

    // Registrar Saída e Calcular Valor
    function registrarSaida(botao, codigoVaga) {
      const linha = botao.closest('tr');
      const tempoEntrada = parseInt(linha.getAttribute('data-hora-entrada'));
      const tipo = linha.getAttribute('data-tipo');
      const tempoSaida = new Date().getTime();

      // Cálculo de permanência (Valor base proporcional por hora)
      const diferencaHoras = Math.max(1, Math.ceil((tempoSaida - tempoEntrada) / (1000 * 60 * 60))); 
      let tarifaHora = 10;
      if (tipo === 'Moto') tarifaHora = 5;
      if (tipo === 'Utilitario') tarifaHora = 15;

      const valorCobrado = diferencaHoras * tarifaHora;

      faturamentoAcumulado += valorCobrado;
      totalFaturamento.textContent = `R$ ${faturamentoAcumulado.toFixed(2)}`;

      // Atualiza Tabela
      linha.children[5].innerHTML = `<span class="badge badge-pago">Pago (R$ ${valorCobrado.toFixed(2)})</span>`;
      linha.children[6].textContent = '-';

      // Libera a Vaga no Mapa
      const elementoVaga = document.querySelector(`.vaga[data-codigo="${codigoVaga}"]`);
      if (elementoVaga) {
        elementoVaga.classList.remove('ocupada');
        elementoVaga.classList.add('livre');
        const infoVaga = listaVagas.find(v => v.codigo === codigoVaga);
        elementoVaga.querySelector('span').textContent = infoVaga.tipo !== 'Normal' ? infoVaga.tipo : 'Livre';
      }

      ativosCount = Math.max(0, ativosCount - 1);
      totalAtivos.textContent = ativosCount;
    }

    carregarVagas();
  </script>
</body>
</html>
