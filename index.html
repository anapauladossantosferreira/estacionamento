<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Estacionamento</title>
  <style>
    /* RESET E ESTILOS GERAIS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    header {
      background-color: #1e293b;
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* CONTAINER PRINCIPAL */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    /* CARDS E PAINÉIS */
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }

    /* FORMULÁRIOS */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    /* MAPA DE VAGAS */
    .grid-vagas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .vaga {
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 80px;
    }

    .vaga span {
      font-size: 0.75rem;
      font-weight: normal;
      margin-top: 4px;
    }

    .livre { background-color: #10b981; }
    .ocupada { background-color: #ef4444; }
    .preferencial { border: 3px solid #f59e0b; }

    /* TABELAS */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.9rem;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: white;
    }

    .badge-pago { background-color: #10b981; }
    .badge-pendente { background-color: #f59e0b; }
  </style>
</head>
<body>

  <header>
    <h1>Estacionamento ParkSys</h1>
    <div>Status do Sistema: <strong>Online</strong></div>
  </header>

  <div class="dashboard">
    <aside>
      <div class="card">
        <h2>Entrada de Veículo</h2>
        <form id="form-entrada">
          <div class="form-group">
            <label>Placa do Veículo</label>
            <input type="text" id="campo-placa" placeholder="ABC-1234" required>
          </div>
          <div class="form-group">
            <label>Tipo de Veículo</label>
            <select id="select-tipo">
              <option>Pequeno / Hatch</option>
              <option>Médio / Sedan</option>
              <option>SUV / Grande</option>
              <option>Motocicleta</option>
            </select>
          </div>
          <div class="form-group">
            <label>Vaga Selecionada</label>
            <select id="select-vaga">
              <option value="A1">A1 (Normal)</option>
              <option value="A2">A2 (Normal)</option>
              <option value="A3">A3 (PCD)</option>
              <option value="B1">B1 (Normal)</option>
            </select>
          </div>
          <button type="submit" class="btn">Registrar Entrada</button>
        </form>
      </div>

      <div class="card">
        <h2>Resumo do Dia</h2>
        <table>
          <tr>
            <td>Veículos Ativos:</td>
            <td><strong id="total-ativos">1</strong></td>
          </tr>
          <tr>
            <td>Faturamento Estimado:</td>
            <td><strong>R$ 680,00</strong></td>
          </tr>
        </table>
      </div>
    </aside>

    <main>
      <div class="card">
        <h2>Status das Vagas</h2>
        <div class="grid-vagas">
          <div class="vaga livre" data-codigo="A1">
            A1
            <span>Livre</span>
          </div>
          <div class="vaga ocupada" data-codigo="A2">
            A2
            <span>ABC-1234</span>
          </div>
